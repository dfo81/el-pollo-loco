<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El pollo loco</title>
    <link rel="shortcut icon" href="./assets/img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />

    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/sound.class.js"></script>
    <script src="./classes/sounds.class.js"></script>
    <script src="./classes/background.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/chicks.class.js"></script>
    <script src="./classes/boss.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/boss-status-bar.class.js"></script>
    <script src="./classes/bottle-status-bar.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/coins-status-bar.class.js"></script>
    <script src="./classes/coins.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>
    <script src="./game.js"></script>
    <script src="./levels/level1.js"></script>
  </head>
  <body onload="init()">
    <div id="rotateScreen" class="rotate-screen">
      <div class="rotate-content">
        <img src="assets/icons/rotate.png" alt="Rotate Icon" />
        <p>Please Rotate Your Device</p>
      </div>
    </div>
    <h1>El pollo loco</h1>
    <div class="game" id="game">
      <div id="startScreen" class="start-screen">
        <img src="./assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="" />
      </div>
      <div class="menu">
        <div class="button-item">
          <img class="button" src="./assets/icons/play.png" alt="Play" onclick="startGame()" />
          <span>Play</span>
        </div>
        <div class="button-item">
          <img class="button music-off" id="music" alt="Volume" onclick="toggleMusic()" />
          <span>Music</span>
        </div>
        <div class="button-item">
          <img class="button" src="./assets/icons/lyric.png" alt="Lyrics" />
          <span>Lyrics</span>
        </div>
        <div class="button-item">
          <img class="button" src="./assets/icons/full-screen.png" alt="Fullscreen" onclick="toggleFullscreen()"/>
          <span>Fullscreen</span>
        </div>
      </div>
      <div class="play-buttons d-none" id="playButtons">
        <div class="action-buttons">
          <img src="./assets/icons/left.png" id="btnLeft" alt="" />
          <img src="./assets/icons/right.png" id="btnRight" alt="" />
        </div>
        <div class="action-buttons">
          <img src="./assets/icons/up.png" id="btnJump" alt="" />
          <img src="./assets/icons/throw.png" id="btnThrow" alt="" />
        </div>
      </div>
      <canvas id="canvas" width="854" height="480"></canvas>
    </div>
  </body>
</html>
